# gradle/libs.versions.toml

[versions]
# Android Gradle Plugin & Kotlin
agp = "8.5.1" # Current stable AGP version
kotlin = "1.9.22" # Current stable Kotlin version

# AndroidX Core libraries
androidx-core-ktx = "1.13.1"
androidx-appcompat = "1.7.0"
androidx-activity-ktx = "1.9.0"
androidx-lifecycle-runtime-ktx = "2.8.0"
androidx-lifecycle-viewmodel-ktx = "2.8.0"
androidx-constraintlayout = "2.1.4"
androidx-annotation = "1.7.1" # For annotations like @SuppressLint

# Google Material Design
google-android-material = "1.12.0"

# Kotlin Coroutines
kotlinx-coroutines = "1.8.0" # Current stable for Kotlin Coroutines

# Networking
okhttp = "4.12.0" # Current stable for OkHttp 4.x.x

# JSON Serialization
gson = "2.10.1" # Current stable version

# Image Loading
glide = "4.16.0" # Current stable version

# Jetpack Compose (Uncomment if you decide to use Compose)
# androidx-compose-bom = "2024.06.00"
# androidx-compose-ui-graphics = "1.6.8"


# Testing Libraries
junit = "4.13.2"
androidx-test-ext-junit = "1.1.5"
androidx-test-espresso-core = "3.5.1"

# Performance Tracing (if needed, from your original)
tracing-perfetto-handshake = "1.0.0"


[libraries]
# AndroidX Core libraries
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core-ktx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidx-appcompat" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "androidx-activity-ktx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidx-lifecycle-runtime-ktx" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "androidx-lifecycle-viewmodel-ktx" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "androidx-constraintlayout" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "androidx-annotation" }

# Google Material Design
google-android-material = { group = "com.google.android.material", name = "material", version.ref = "google-android-material" }

# Networking
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }

# JSON Serialization/Deserialization
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }

# Image Loading
glide = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }
glide-compiler = { group = "com.github.bumptech.glide", name = "compiler", version.ref = "glide" } # Annotation processor for Glide

# Kotlin Coroutines
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }

# Jetpack Compose (Uncomment if you decide to use Compose)
# androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "androidx-compose-bom" }
# androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics", version.ref = "androidx-compose-ui-graphics" }


# Testing Libraries
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-ext-junit" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidx-test-espresso-core" }

# Performance Tracing (if needed)
androidx-tracing-perfetto-handshake = { group = "androidx.tracing", name = "tracing-perfetto-handshake", version.ref = "tracing-perfetto-handshake" }


[plugins]
# Plugin definitions, referencing versions from above
androidApplication = { id = "com.android.application", version.ref = "agp" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinKapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" } # Required for annotation processors like Glide Compiler
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" } # If you are using Kotlin Serialization
# kotlinCompose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" } # Uncomment if you use Jetpack Compose